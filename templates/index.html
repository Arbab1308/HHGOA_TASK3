<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face-Blockchain Verification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --bg-color: #0b0c10;
            --surface-color: rgba(30, 31, 38, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #9ba1a6;
            --accent-color: #ffffff;
            --success-color: #4cd964;
            --error-color: #ff3b30;
            --glass-blur: blur(16px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-weight: 500;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 300;
        }

        .upload-area {
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.01);
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.03);
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
            opacity: 0.8;
            transition: transform 0.3s ease;
        }

        .upload-area:hover .upload-icon {
            transform: translateY(-5px);
        }

        #file-input {
            display: none;
        }

        .upload-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .upload-text strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Loading State */
        .loading-container {
            display: none;
            text-align: center;
            padding: 2rem 0;
            animation: fadeIn 0.5s ease forwards;
        }

        .pipeline-flow {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2rem 0;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .flow-step {
            display: flex;
            align-items: center;
        }

        .step-box {
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .flow-step.active .step-box {
            color: #fff;
            border-color: transparent;
            background: linear-gradient(135deg, #8e2de2 0%, #4a00e0 100%);
            box-shadow: 0 0 20px rgba(142, 45, 226, 0.6);
            transform: scale(1.05);
            animation: pulse-gradient 2s infinite;
        }

        .flow-step.done .step-box {
            color: #fff;
            border-color: var(--success-color);
            background: rgba(76, 217, 100, 0.15);
            box-shadow: 0 0 10px rgba(76, 217, 100, 0.2);
        }

        .flow-arrow {
            color: var(--text-secondary);
            font-size: 1rem;
            opacity: 0.3;
            margin: 0 0.2rem;
            transition: all 0.3s ease;
        }
        
        .flow-step.active ~ .flow-arrow {
            opacity: 0.3;
            color: var(--text-secondary);
            text-shadow: none;
        }

        .flow-step.done + .flow-arrow {
            color: var(--success-color);
            opacity: 1;
            text-shadow: 0 0 8px rgba(76, 217, 100, 0.4);
        }

        @keyframes pulse-gradient {
            0% { box-shadow: 0 0 15px rgba(142, 45, 226, 0.4); }
            50% { box-shadow: 0 0 25px rgba(142, 45, 226, 0.8); }
            100% { box-shadow: 0 0 15px rgba(142, 45, 226, 0.4); }
        }

        .status-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-top: 1rem;
            transition: opacity 0.3s ease;
        }

        /* Results State */
        .results-container {
            display: none;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .result-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .result-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            background: rgba(76, 217, 100, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(76, 217, 100, 0.2);
        }

        .badge.error {
            background: rgba(255, 59, 48, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(255, 59, 48, 0.2);
        }

        .data-row {
            display: flex;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }

        .data-row:last-child {
            margin-bottom: 0;
        }

        .data-label {
            color: var(--text-secondary);
            width: 120px;
            flex-shrink: 0;
        }

        .data-value {
            color: var(--text-primary);
            word-break: break-all;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .btn-reset {
            display: block;
            width: 100%;
            padding: 1rem;
            background: var(--text-primary);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.2s ease;
        }

        .btn-reset:hover {
            opacity: 0.9;
            transform: scale(0.98);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Preview Image */
        #image-preview {
            max-width: 100px;
            max-height: 100px;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: none;
            border: 2px solid var(--border-color);
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div class="header">
            <h1>Identity Verification</h1>
            <p class="subtitle">Face Scan → Discovery → Blockchain</p>
        </div>

        <!-- Upload View -->
        <div id="upload-view">
            <div class="upload-area" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <div class="upload-icon">⎈</div>
                <p class="upload-text"><strong>Click to upload</strong> or drag and drop<br>SVG, PNG, JPG</p>
                <input type="file" id="file-input" accept="image/*">
            </div>
        </div>

        <!-- Loading View -->
        <div class="loading-container" id="loading-view">
            <img id="image-preview" src="" alt="Preview">
            
            <div class="pipeline-flow">
                <div class="flow-step" id="step-detect">
                    <div class="step-box">Face Det</div>
                </div>
                <div class="flow-arrow">➔</div>
                
                <div class="flow-step" id="step-osint">
                    <div class="step-box">OSINT Engine</div>
                </div>
                <div class="flow-arrow">➔</div>
                
                <div class="flow-step" id="step-ipfs">
                    <div class="step-box">IPFS Hash</div>
                </div>
                <div class="flow-arrow">➔</div>
                
                <div class="flow-step" id="step-chain">
                    <div class="step-box">Verify</div>
                </div>
            </div>
            
            <p class="status-text" id="loading-status">Initiating Pipeline...</p>
        </div>

        <!-- Results View -->
        <div class="results-container" id="results-view">
            
            <div class="result-card">
                <div class="result-header">
                    <span class="result-title">Discovery</span>
                    <span class="badge" id="discovery-platform">Platform</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Profile ID</span>
                    <span class="data-value" id="res-username"></span>
                </div>
                <div class="data-row">
                    <span class="data-label">Engagement</span>
                    <span class="data-value" id="res-engagement"></span>
                </div>
            </div>

            <div class="result-card">
                <div class="result-header">
                    <span class="result-title">Blockchain Record</span>
                    <span class="badge" id="verification-badge">Verified</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Network</span>
                    <span class="data-value" id="res-network"></span>
                </div>
                <div class="data-row">
                    <span class="data-label">Tx Hash</span>
                    <span class="data-value" id="res-tx"></span>
                </div>
                <div class="data-row">
                    <span class="data-label">Data Hash</span>
                    <span class="data-value" id="res-hash"></span>
                </div>
            </div>

            <button class="btn-reset" onclick="resetUI()">Verify Another Identity</button>
        </div>

    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        
        const uploadView = document.getElementById('upload-view');
        const loadingView = document.getElementById('loading-view');
        const resultsView = document.getElementById('results-view');
        
        const loadingStatus = document.getElementById('loading-status');
        const imagePreview = document.getElementById('image-preview');

        // Drag & Drop Handlers
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            let dt = e.dataTransfer;
            let files = dt.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
            }
            reader.readAsDataURL(file);

            uploadFile(file);
        }

        function setStatus(text, stepId) {
            loadingStatus.style.opacity = 0;
            
            // Deactivate all first
            document.querySelectorAll('.flow-step').forEach(el => el.classList.remove('active'));
            
            if (stepId) {
                const currentStep = document.getElementById(stepId);
                if (currentStep) currentStep.classList.add('active');
                
                // Mark previous steps as done
                let sibling = currentStep.previousElementSibling;
                while (sibling) {
                    if (sibling.classList.contains('flow-step')) {
                        sibling.classList.add('done');
                    }
                    sibling = sibling.previousElementSibling;
                }
            }
            
            setTimeout(() => {
                loadingStatus.textContent = text;
                loadingStatus.style.opacity = 1;
            }, 200);
        }

        async function uploadFile(file) {
            // Transition to loading state
            uploadView.style.display = 'none';
            loadingView.style.display = 'block';
            
            // Reset blocks
            document.querySelectorAll('.flow-step').forEach(el => {
                el.classList.remove('active', 'done');
            });
            
            setStatus("Extracting biometric encodings...", "step-detect");
            
            // Start OSINT visually after a short delay (FaceDet is fast)
            setTimeout(() => {
                setStatus("Driving Headless Browser for OSINT...", "step-osint");
            }, 2500);

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // When fetch returns, pipeline is completely done
                // Flash the last two steps very quickly before showing results for visual effect
                setStatus("Generating IPFS Content Hash...", "step-ipfs");
                
                setTimeout(() => {
                    setStatus("Securing on Blockchain...", "step-chain");
                }, 400);
                
                setTimeout(() => {
                    document.getElementById('step-chain').classList.remove('active');
                    document.getElementById('step-chain').classList.add('done');
                    
                    if (data.status === 'success') {
                        displayResults(data);
                    } else {
                        showError(data.error || "Verification failed");
                    }
                }, 800);
                
            } catch (error) {
                showError("Network or Server error occurred");
            }
        }

        function displayResults(data) {
            loadingView.style.display = 'none';
            resultsView.style.display = 'block';
            
            // Extract data
            const social = data.steps.social_search.result ? data.steps.social_search.result.top_match : data.steps.social_search.top_match;
            const blockchain = data.steps.blockchain_verification.result ? data.steps.blockchain_verification.result : data.steps.blockchain_verification;
            
            // Populate UI
            document.getElementById('discovery-platform').textContent = social.platform || 'Unknown';
            document.getElementById('res-username').textContent = social.username || 'Unknown';
            document.getElementById('res-engagement').textContent = `${social.likes || 0} L / ${social.comments || 0} C`;
            
            document.getElementById('res-network').textContent = blockchain.blockchain || 'Unknown';
            document.getElementById('res-tx').textContent = truncateStr(blockchain.transaction_hash);
            document.getElementById('res-hash').textContent = truncateStr(blockchain.data_hash);
            
            const badge = document.getElementById('verification-badge');
            if (blockchain.is_verified) {
                badge.textContent = "VERIFIED";
                badge.className = "badge";
            } else {
                badge.textContent = "FAILED";
                badge.className = "badge error";
            }
        }

        function showError(msg) {
            loadingView.style.display = 'none';
            resultsView.style.display = 'block';
            
            document.querySelector('.results-container').innerHTML = `
                <div class="result-card" style="text-align:center; padding: 3rem 1rem;">
                    <div style="color: var(--error-color); margin-bottom: 1rem; font-size: 2rem;">⚠</div>
                    <p style="color: var(--text-primary); margin-bottom: 0.5rem;">Pipeline Error</p>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">${msg}</p>
                </div>
                <button class="btn-reset" onclick="resetUI()">Try Again</button>
            `;
        }

        function resetUI() {
            window.location.reload();
        }

        function truncateStr(str) {
            if (!str) return "";
            return str.substring(0, 12) + "..." + str.substring(str.length - 8);
        }
    </script>
</body>
</html>
